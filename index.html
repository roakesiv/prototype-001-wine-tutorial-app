<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#782e46">
  <title>A Little Wine · Beginner Tasting Guide</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='26'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="app-card">
      <header class="app-header"><h1>A little wine<span aria-hidden="true"> ✳</span></h1><p class="subtitle">A beginner’s tasting companion</p></header>
      <section class="progress-section" aria-label="Your tasting progress">
        <p id="progress-text">Step 1 of 6 · Welcome</p>
        <div class="progress-bar" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
        <ol id="step-trail" class="step-trail" aria-label="Tasting steps"></ol>
      </section>
      <section class="step-section" aria-labelledby="step-title">
        <h2 id="step-title" tabindex="-1">Welcome</h2>
        <div id="step-content" class="step-content"></div>
      </section>
      <p id="selection-status" role="status" class="selection-status"></p>
      <p id="validation-message" role="alert" class="validation-message"></p>
      <footer class="navigation">
        <button id="back-button" class="secondary-button" type="button">← Back</button>
        <button id="next-button" class="primary-button" type="button">Next</button>
      </footer>
      <p class="session-note">Just you and your glass. Notes stay here until you close or reload.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
